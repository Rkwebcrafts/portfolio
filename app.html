<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow Pro — Productivity Suite</title>
  
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5' }
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Recharts CDN Dependencies & Library -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const { ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip, CartesianGrid } = window.Recharts;

    const TODAY_DATE = new Date();
    const TODAY_STR = TODAY_DATE.toISOString().split("T")[0];

    const INITIAL_TASKS = [
      { id: '1', title: 'Complete React Dashboard Architecture', category: 'College', priority: 'High', status: 'in_progress', completed: false, dueDate: TODAY_STR, completedAt: null, description: 'Wireframe and prototype full production layout.' },
      { id: '2', title: 'Submit Client UI Specs', category: 'Freelancing', priority: 'High', status: 'completed', completed: true, dueDate: TODAY_STR, completedAt: TODAY_STR, description: 'Send final design assets to client.' },
      { id: '3', title: 'Morning 5k Run & Stretch', category: 'Fitness', priority: 'Low', status: 'todo', completed: false, dueDate: TODAY_STR, completedAt: null, description: '30 minutes cardio session.' },
      { id: '4', title: 'Weekly Grocery Shopping', category: 'Personal', priority: 'Medium', status: 'review', completed: false, dueDate: '2026-07-30', completedAt: null, description: 'Buy healthy meal prep items.' }
    ];

    const KANBAN_STAGES = [
      { id: 'todo', title: 'To Do', border: 'border-slate-400' },
      { id: 'in_progress', title: 'In Progress', border: 'border-amber-500' },
      { id: 'review', title: 'Review', border: 'border-indigo-500' },
      { id: 'completed', title: 'Completed', border: 'border-emerald-500' }
    ];

    // Search Highlight Helper Component
    function HighlightText({ text, query }) {
      if (!query.trim()) return <span>{text}</span>;
      const parts = text.split(new RegExp(`(${query})`, 'gi'));
      return (
        <span>
          {parts.map((part, i) => 
            part.toLowerCase() === query.toLowerCase() ? (
              <mark key={i} className="bg-amber-200 dark:bg-amber-800 dark:text-amber-100 px-0.5 rounded text-amber-900 font-bold">{part}</mark>
            ) : part
          )}
        </span>
      );
    }

    function TaskFlowPro() {
      // Auth State with localStorage Persistence
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('tf_user');
        return saved ? JSON.parse(saved) : { name: 'John Doe', email: 'john@taskflow.dev', avatar: null, isAuth: true };
      });

      // Navigation & Layout States
      const [currentView, setCurrentView] = useState('dashboard');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      // Dark Mode & Settings State
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('tf_theme') === 'dark');
      const [settings, setSettings] = useState(() => {
        const saved = localStorage.getItem('tf_settings');
        return saved ? JSON.parse(saved) : { notifications: true, language: 'English', timeFormat: '24h', timezone: 'UTC+5:30 (IST)' };
      });

      // Core Task State
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('tf_pro_tasks_v4');
        return saved ? JSON.parse(saved) : INITIAL_TASKS;
      });

      // Filter States
      const [searchQuery, setSearchQuery] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [priorityFilter, setPriorityFilter] = useState('All');
      const [statusFilter, setStatusFilter] = useState('All');

      // Calendar Navigation State
      const [calendarDate, setCalendarDate] = useState(new Date(TODAY_DATE.getFullYear(), TODAY_DATE.getMonth(), 1));

      // Modals State
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingTask, setEditingTask] = useState(null);
      const [formData, setFormData] = useState({
        title: '', description: '', category: 'Personal', priority: 'Medium', dueDate: TODAY_STR, status: 'todo'
      });
      const [deletingTaskId, setDeletingTaskId] = useState(null);

      // Pomodoro Focus Timer State
      const [timerSeconds, setTimerSeconds] = useState(25 * 60);
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      // Dashboard Widgets State
      const [quickNote, setQuickNote] = useState(() => localStorage.getItem('tf_note') || '');
      const [weeklyGoal, setWeeklyGoal] = useState(10);

      // Toast Notifications
      const [toast, setToast] = useState(null);
      const searchInputRef = useRef(null);
      const fileInputRef = useRef(null);

      const triggerToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Persistent Storage Sync
      useEffect(() => {
        localStorage.setItem('tf_pro_tasks_v4', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        localStorage.setItem('tf_settings', JSON.stringify(settings));
      }, [settings]);

      useEffect(() => {
        localStorage.setItem('tf_note', quickNote);
      }, [quickNote]);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('tf_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('tf_theme', 'light');
        }
      }, [darkMode]);

      // Optimized Lucide Icon Sync
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [currentView, darkMode, tasks, user, isModalOpen, deletingTaskId, calendarDate]);

      // Pomodoro Interval Effect
      useEffect(() => {
        let interval = null;
        if (isTimerRunning && timerSeconds > 0) {
          interval = setInterval(() => setTimerSeconds(prev => prev - 1), 1000);
        } else if (timerSeconds === 0) {
          setIsTimerRunning(false);
          triggerToast('Pomodoro session completed! Great focus 🎉', 'success');
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, timerSeconds]);

      // Global Keyboard Shortcuts (Ctrl + K, Ctrl + N)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            if (searchInputRef.current) searchInputRef.current.focus();
          }
          if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
            e.preventDefault();
            openModal();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Persistent Authentication Toggle
      const toggleAuth = () => {
        const updated = { ...user, isAuth: !user.isAuth };
        setUser(updated);
        localStorage.setItem('tf_user', JSON.stringify(updated));
        triggerToast(updated.isAuth ? 'Welcome back!' : 'Logged out successfully.');
      };

      // Profile Update Handler
      const handleProfileUpdate = (e) => {
        e.preventDefault();
        localStorage.setItem('tf_user', JSON.stringify(user));
        triggerToast('Profile updated successfully!', 'success');
      };

      // Task CRUD Logic
      const handleSaveTask = (e) => {
        e.preventDefault();
        if (!formData.title.trim()) return;

        const isCompleted = formData.status === 'completed';

        if (editingTask) {
          setTasks(tasks.map(t => t.id === editingTask.id ? {
            ...t,
            ...formData,
            completed: isCompleted,
            completedAt: isCompleted ? (t.completedAt || TODAY_STR) : null
          } : t));
          triggerToast('Task updated successfully!', 'success');
        } else {
          const newTask = {
            id: Date.now().toString(),
            ...formData,
            completed: isCompleted,
            completedAt: isCompleted ? TODAY_STR : null
          };
          setTasks([newTask, ...tasks]);
          triggerToast('New task created!', 'success');
        }
        closeModal();
      };

      const confirmDeleteTask = () => {
        if (!deletingTaskId) return;
        setTasks(tasks.filter(t => t.id !== deletingTaskId));
        setDeletingTaskId(null);
        triggerToast('Task deleted.', 'info');
      };

      const openModal = (task = null) => {
        if (task) {
          setEditingTask(task);
          setFormData({
            title: task.title,
            description: task.description || '',
            category: task.category,
            priority: task.priority,
            dueDate: task.dueDate || TODAY_STR,
            status: task.status || 'todo'
          });
        } else {
          setEditingTask(null);
          setFormData({
            title: '', description: '', category: 'Personal', priority: 'Medium', dueDate: TODAY_STR, status: 'todo'
          });
        }
        setIsModalOpen(true);
      };

      const closeModal = () => {
        setIsModalOpen(false);
        setEditingTask(null);
      };

      const resetFilters = () => {
        setSearchQuery('');
        setCategoryFilter('All');
        setPriorityFilter('All');
        setStatusFilter('All');
        triggerToast('Filters reset.');
      };

      // Filter Operations
      const filteredTasks = useMemo(() => {
        return tasks.filter(task => {
          const matchesSearch = task.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (task.description && task.description.toLowerCase().includes(searchQuery.toLowerCase()));
          const matchesCategory = categoryFilter === 'All' || task.category === categoryFilter;
          const matchesPriority = priorityFilter === 'All' || task.priority === priorityFilter;
          const matchesStatus = statusFilter === 'All' || task.status === statusFilter;

          return matchesSearch && matchesCategory && matchesPriority && matchesStatus;
        });
      }, [tasks, searchQuery, categoryFilter, priorityFilter, statusFilter]);

      // Metrics & Statistics Calculations
      const metrics = useMemo(() => {
        const total = tasks.length;
        const completed = tasks.filter(t => t.completed || t.status === 'completed').length;
        const pending = total - completed;
        const productivity = total > 0 ? Math.round((completed / total) * 100) : 0;
        const todaysTasks = tasks.filter(t => t.dueDate === TODAY_STR).length;
        const overdue = tasks.filter(t => !t.completed && t.dueDate < TODAY_STR).length;

        return { total, completed, pending, productivity, todaysTasks, overdue };
      }, [tasks]);

      // Dynamic Weekly Chart Calculations
      const weeklyChartData = useMemo(() => {
        const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        return days.map((day, idx) => {
          const d = new Date(TODAY_DATE);
          const currentDayIdx = d.getDay() === 0 ? 6 : d.getDay() - 1;
          const diff = idx - currentDayIdx;
          d.setDate(d.getDate() + diff);
          const dateStr = d.toISOString().split('T')[0];

          const completed = tasks.filter(t => t.completedAt === dateStr || (t.completed && t.dueDate === dateStr)).length;
          const pending = tasks.filter(t => !t.completed && t.dueDate === dateStr).length;

          return { day, completed, pending };
        });
      }, [tasks]);

      // Calendar Data Engine
      const calendarData = useMemo(() => {
        const year = calendarDate.getFullYear();
        const month = calendarDate.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const days = [];
        for (let i = 0; i < firstDay; i++) days.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const formatted = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          days.push({ dayNumber: d, fullDate: formatted });
        }
        const monthName = calendarDate.toLocaleString('default', { month: 'long', year: 'numeric' });
        return { days, monthName };
      }, [calendarDate]);

      // Export CSV Logic
      const exportToCSV = () => {
        const headers = 'ID,Title,Description,Category,Priority,Status,Completed,DueDate\n';
        const rows = tasks.map(t => `"${t.id}","${t.title.replace(/"/g, '""')}","${(t.description || '').replace(/"/g, '""')}","${t.category}","${t.priority}","${t.status}",${t.completed},"${t.dueDate}"`).join('\n');
        const blob = new Blob([headers + rows], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `TaskFlow_Export_${TODAY_STR}.csv`;
        a.click();
        triggerToast('Exported tasks to CSV!', 'success');
      };

      // Import CSV Logic
      const handleImportCSV = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const text = evt.target.result;
            const lines = text.split('\n').slice(1);
            const imported = lines.filter(l => l.trim()).map((line, i) => {
              const cols = line.split(',').map(c => c.replace(/^"|"$/g, '').trim());
              return {
                id: (Date.now() + i).toString(),
                title: cols[1] || 'Imported Task',
                description: cols[2] || '',
                category: cols[3] || 'General',
                priority: cols[4] || 'Medium',
                status: cols[5] || 'todo',
                completed: cols[6] === 'true',
                dueDate: cols[7] || TODAY_STR
              };
            });
            setTasks([...imported, ...tasks]);
            triggerToast(`Successfully imported ${imported.length} tasks!`, 'success');
          } catch (err) {
            triggerToast('Failed to parse CSV file.', 'error');
          }
        };
        reader.readAsText(file);
      };

      // Native Drag & Drop Handlers
      const handleDragStart = (e, id) => {
        e.dataTransfer.setData('taskId', id);
      };

      const handleDrop = (e, newStatus) => {
        e.preventDefault();
        const taskId = e.dataTransfer.getData('taskId');
        if (!taskId) return;

        setTasks(tasks.map(t => {
          if (t.id === taskId) {
            const isCompleted = newStatus === 'completed';
            return {
              ...t,
              status: newStatus,
              completed: isCompleted,
              completedAt: isCompleted ? TODAY_STR : null
            };
          }
          return t;
        }));
        triggerToast(`Moved task to ${newStatus.replace('_', ' ')}`);
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60).toString().padStart(2, '0');
        const s = (secs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      if (!user.isAuth) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xl w-full max-w-md space-y-6">
              <div className="text-center">
                <div className="bg-indigo-600 text-white w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-3">
                  <i data-lucide="lock" className="w-6 h-6"></i>
                </div>
                <h2 className="text-2xl font-black">Sign in to TaskFlow</h2>
                <p className="text-xs text-slate-400 mt-1">Manage your enterprise tasks and productivity</p>
              </div>
              <button
                onClick={toggleAuth}
                className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm transition flex items-center justify-center gap-2"
                aria-label="Sign in"
              >
                <i data-lucide="log-in" className="w-4 h-4"></i> Sign In as Demo User
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          
          {/* Toast Banner System */}
          {toast && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-2.5 rounded-xl shadow-2xl font-medium text-sm flex items-center gap-2 transition animate-bounce ${
              toast.type === 'error' ? 'bg-rose-600 text-white' :
              toast.type === 'success' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-white dark:bg-white dark:text-slate-900'
            }`}>
              <i data-lucide="bell" className="w-4 h-4"></i>
              {toast.msg}
            </div>
          )}

          {/* Sidebar */}
          <aside className="w-full md:w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 p-5 flex flex-col justify-between shrink-0">
            <div>
              <div className="flex items-center justify-between mb-8">
                <div className="flex items-center gap-2.5">
                  <div className="bg-indigo-600 text-white p-2 rounded-xl">
                    <i data-lucide="layers" className="w-5 h-5"></i>
                  </div>
                  <span className="font-black text-xl tracking-tight">TaskFlow</span>
                </div>

                <div className="flex items-center gap-1">
                  <button
                    onClick={() => setDarkMode(!darkMode)}
                    className="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700"
                    aria-label="Toggle dark mode"
                  >
                    <i data-lucide={darkMode ? "sun" : "moon"} className="w-4 h-4"></i>
                  </button>
                  <button
                    onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                    className="p-2 rounded-lg md:hidden border border-slate-200 dark:border-slate-700"
                    aria-label="Toggle menu"
                  >
                    <i data-lucide="menu" className="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              {/* Navigation Items */}
              <nav className={`space-y-1 ${isMobileMenuOpen ? 'block' : 'hidden md:block'}`}>
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
                  { id: 'kanban', label: 'Kanban Board', icon: 'kanban' },
                  { id: 'calendar', label: 'Calendar', icon: 'calendar' },
                  { id: 'profile', label: 'Profile', icon: 'user' },
                  { id: 'settings', label: 'Settings', icon: 'settings' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => { setCurrentView(item.id); setIsMobileMenuOpen(false); }}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition ${
                      currentView === item.id 
                        ? 'bg-indigo-600 text-white shadow-sm' 
                        : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50'
                    }`}
                  >
                    <i data-lucide={item.icon} className="w-4 h-4"></i>
                    {item.label}
                  </button>
                ))}
              </nav>
            </div>

            {/* Sidebar Pomodoro Focus Timer */}
            <div className="my-6 bg-slate-50 dark:bg-slate-900/60 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 hidden md:block">
              <div className="flex items-center justify-between text-xs font-bold text-slate-500 mb-2">
                <span className="flex items-center gap-1"><i data-lucide="timer" className="w-3.5 h-3.5"></i> Pomodoro Focus</span>
                <span>25m</span>
              </div>
              <div className="text-2xl font-black text-center my-1 tracking-wider">{formatTime(timerSeconds)}</div>
              <div className="flex gap-2 mt-2">
                <button
                  onClick={() => setIsTimerRunning(!isTimerRunning)}
                  className="flex-1 bg-indigo-600 text-white text-xs font-semibold py-1.5 rounded-lg hover:bg-indigo-700 transition"
                >
                  {isTimerRunning ? 'Pause' : 'Start'}
                </button>
                <button
                  onClick={() => { setIsTimerRunning(false); setTimerSeconds(25*60); }}
                  className="px-2 py-1.5 bg-slate-200 dark:bg-slate-700 text-xs rounded-lg font-semibold"
                >
                  Reset
                </button>
              </div>
            </div>

            {/* User Profile Card */}
            <div className="pt-4 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                {user.avatar ? (
                  <img src={user.avatar} className="w-9 h-9 rounded-full object-cover" alt="User Avatar" />
                ) : (
                  <div className="w-9 h-9 rounded-full bg-indigo-600 text-white font-bold text-xs flex items-center justify-center">JD</div>
                )}
                <div className="text-xs">
                  <span className="font-bold block">{user.name}</span>
                  <span className="text-slate-400 text-[10px]">PRO Plan</span>
                </div>
              </div>
              <button onClick={toggleAuth} className="text-slate-400 hover:text-rose-500" aria-label="Sign out">
                <i data-lucide="log-out" className="w-4 h-4"></i>
              </button>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 p-4 md:p-8 max-w-7xl overflow-x-hidden">
            
            {/* Search and Filters Toolbar */}
            <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm mb-6 flex flex-col lg:flex-row gap-4 justify-between items-center">
              <div className="relative w-full lg:w-64">
                <i data-lucide="search" className="w-4 h-4 absolute left-3.5 top-3 text-slate-400"></i>
                <input
                  ref={searchInputRef}
                  type="text"
                  placeholder="Search tasks (Ctrl + K)..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />
              </div>

              <div className="flex flex-wrap items-center gap-2 w-full lg:w-auto">
                <select
                  value={categoryFilter}
                  onChange={(e) => setCategoryFilter(e.target.value)}
                  className="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs rounded-xl px-3 py-2 font-medium"
                >
                  <option value="All">All Categories</option>
                  <option value="Personal">Personal</option>
                  <option value="College">College</option>
                  <option value="Freelancing">Freelancing</option>
                  <option value="Fitness">Fitness</option>
                </select>

                <select
                  value={priorityFilter}
                  onChange={(e) => setPriorityFilter(e.target.value)}
                  className="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-xs rounded-xl px-3 py-2 font-medium"
                >
                  <option value="All">All Priorities</option>
                  <option value="High">High Priority</option>
                  <option value="Medium">Medium Priority</option>
                  <option value="Low">Low Priority</option>
                </select>

                <button
                  onClick={resetFilters}
                  className="p-2 border border-slate-200 dark:border-slate-700 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl text-xs font-semibold"
                  title="Reset Filters"
                >
                  <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                </button>

                <button
                  onClick={exportToCSV}
                  className="p-2 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl text-xs font-semibold flex items-center gap-1"
                  title="Export to CSV"
                >
                  <i data-lucide="download" className="w-4 h-4"></i> CSV
                </button>

                <button
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}
                  className="p-2 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl text-xs font-semibold flex items-center gap-1"
                  title="Import CSV"
                >
                  <i data-lucide="upload" className="w-4 h-4"></i>
                </button>
                <input ref={fileInputRef} type="file" accept=".csv" onChange={handleImportCSV} className="hidden" />

                <button
                  onClick={() => openModal()}
                  className="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs px-4 py-2 rounded-xl flex items-center gap-1.5 transition ml-auto"
                  aria-label="Create task"
                >
                  <i data-lucide="plus" className="w-4 h-4"></i> Add Task
                </button>
              </div>
            </div>

            {/* PAGE 1: DASHBOARD */}
            {currentView === 'dashboard' && (
              <div className="space-y-6">
                {/* Metric Cards Grid */}
                <div className="grid grid-cols-2 lg:grid-cols-6 gap-3">
                  {[
                    { label: 'Total Tasks', val: metrics.total, color: 'text-indigo-500' },
                    { label: 'Completed', val: metrics.completed, color: 'text-emerald-500' },
                    { label: 'Pending', val: metrics.pending, color: 'text-amber-500' },
                    { label: 'Productivity', val: `${metrics.productivity}%`, color: 'text-indigo-600' },
                    { label: "Today's Tasks", val: metrics.todaysTasks, color: 'text-blue-500' },
                    { label: 'Overdue', val: metrics.overdue, color: 'text-rose-500' }
                  ].map((card, idx) => (
                    <div key={idx} className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                      <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">{card.label}</span>
                      <div className={`text-2xl font-black mt-1 ${card.color}`}>{card.val}</div>
                    </div>
                  ))}
                </div>

                {/* Dashboard Split View */}
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  {/* Dynamic Recharts Bar Chart */}
                  <div className="lg:col-span-2 bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                    <h3 className="text-base font-bold mb-4 flex items-center gap-2">
                      <i data-lucide="bar-chart-2" className="w-5 h-5 text-indigo-500"></i> Weekly Productivity Output
                    </h3>
                    <div className="h-64 w-full">
                      <ResponsiveContainer width="100%" height="100%">
                        <BarChart data={weeklyChartData}>
                          <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#334155" opacity={0.1} />
                          <XAxis dataKey="day" stroke="#94a3b8" fontSize={12} />
                          <YAxis stroke="#94a3b8" fontSize={12} />
                          <Tooltip contentStyle={{ backgroundColor: '#1e293b', border: 'none', borderRadius: '12px', color: '#fff' }} />
                          <Bar dataKey="completed" fill="#22c55e" radius={[4, 4, 0, 0]} name="Completed" />
                          <Bar dataKey="pending" fill="#f59e0b" radius={[4, 4, 0, 0]} name="Pending" />
                        </BarChart>
                      </ResponsiveContainer>
                    </div>
                  </div>

                  {/* Focus & Scratchpad Widgets */}
                  <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                    <h3 className="text-base font-bold flex items-center gap-2">
                      <i data-lucide="target" className="w-5 h-5 text-indigo-500"></i> Today's Focus & Goals
                    </h3>
                    
                    <div>
                      <div className="flex justify-between text-xs font-semibold mb-1">
                        <span>Weekly Goal Target</span>
                        <span>{metrics.completed}/{weeklyGoal} Tasks</span>
                      </div>
                      <div className="w-full bg-slate-100 dark:bg-slate-700 h-2.5 rounded-full overflow-hidden">
                        <div className="bg-emerald-500 h-full transition-all duration-300" style={{ width: `${Math.min(100, (metrics.completed/weeklyGoal)*100)}%` }}></div>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Quick Scratchpad</label>
                      <textarea
                        value={quickNote}
                        onChange={(e) => setQuickNote(e.target.value)}
                        placeholder="Write quick ideas here..."
                        className="w-full h-24 p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs resize-none focus:outline-none"
                      />
                    </div>
                  </div>
                </div>

                {/* Main Task Table & Empty State Handling */}
                <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-3">
                  <h3 className="font-bold text-base">Tasks List ({filteredTasks.length})</h3>
                  
                  {filteredTasks.length === 0 ? (
                    <div className="text-center py-12 space-y-3">
                      <div className="bg-slate-100 dark:bg-slate-700 w-12 h-12 rounded-full flex items-center justify-center mx-auto text-slate-400">
                        <i data-lucide="clipboard-x" className="w-6 h-6"></i>
                      </div>
                      <h4 className="font-bold text-slate-600 dark:text-slate-300">No tasks found</h4>
                      <p className="text-xs text-slate-400">Try adjusting your filters or create a new task.</p>
                      <button onClick={() => openModal()} className="px-4 py-2 bg-indigo-600 text-white text-xs font-semibold rounded-xl">
                        + Add Task
                      </button>
                    </div>
                  ) : (
                    <div className="divide-y divide-slate-100 dark:divide-slate-700">
                      {filteredTasks.map(task => (
                        <div key={task.id} className="py-3 flex items-center justify-between gap-4 group">
                          <div className="flex items-center gap-3">
                            <input
                              type="checkbox"
                              checked={task.completed}
                              onChange={() => {
                                setTasks(tasks.map(t => t.id === task.id ? {
                                  ...t,
                                  completed: !t.completed,
                                  status: !t.completed ? 'completed' : 'todo',
                                  completedAt: !t.completed ? TODAY_STR : null
                                } : t));
                              }}
                              className="w-4 h-4 rounded text-indigo-600"
                            />
                            <div>
                              <span className={`text-sm font-semibold block ${task.completed ? 'line-through text-slate-400' : ''}`}>
                                <HighlightText text={task.title} query={searchQuery} />
                              </span>
                              {task.description && (
                                <p className="text-xs text-slate-400 line-clamp-1">
                                  <HighlightText text={task.description} query={searchQuery} />
                                </p>
                              )}
                              <span className="text-[10px] text-slate-400">{task.category} • Due: {task.dueDate}</span>
                            </div>
                          </div>

                          <div className="flex items-center gap-2">
                            <button onClick={() => openModal(task)} className="p-1.5 text-slate-400 hover:text-indigo-500" aria-label="Edit task">
                              <i data-lucide="pencil" className="w-4 h-4"></i>
                            </button>
                            <button onClick={() => setDeletingTaskId(task.id)} className="p-1.5 text-slate-400 hover:text-rose-500" aria-label="Delete task">
                              <i data-lucide="trash-2" className="w-4 h-4"></i>
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* PAGE 2: DRAG AND DROP KANBAN BOARD */}
            {currentView === 'kanban' && (
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                {KANBAN_STAGES.map(stage => {
                  const stageTasks = filteredTasks.filter(t => t.status === stage.id);
                  return (
                    <div
                      key={stage.id}
                      onDragOver={(e) => e.preventDefault()}
                      onDrop={(e) => handleDrop(e, stage.id)}
                      className="bg-slate-100 dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 flex flex-col min-h-[450px]"
                    >
                      <div className={`flex justify-between items-center pb-2 mb-3 border-b-2 ${stage.border}`}>
                        <h4 className="font-bold text-xs uppercase tracking-wider">{stage.title}</h4>
                        <span className="text-xs bg-slate-200 dark:bg-slate-700 px-2 py-0.5 rounded-full font-bold">{stageTasks.length}</span>
                      </div>

                      <div className="space-y-3 flex-1">
                        {stageTasks.map(task => (
                          <div
                            key={task.id}
                            draggable
                            onDragStart={(e) => handleDragStart(e, task.id)}
                            className="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm cursor-grab active:cursor-grabbing hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 space-y-2"
                          >
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-50 dark:bg-indigo-950 text-indigo-600">{task.category}</span>
                            <h5 className="font-semibold text-sm leading-snug">{task.title}</h5>
                            {task.description && <p className="text-xs text-slate-400 line-clamp-2">{task.description}</p>}
                            <div className="text-[11px] text-slate-400 flex justify-between pt-1">
                              <span>{task.priority} Priority</span>
                              <span>{task.dueDate}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* PAGE 3: MONTHLY CALENDAR VIEW */}
            {currentView === 'calendar' && (
              <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                <div className="flex items-center justify-between mb-6">
                  <h3 className="font-bold text-lg flex items-center gap-2">
                    <i data-lucide="calendar" className="w-5 h-5 text-indigo-500"></i> {calendarData.monthName}
                  </h3>

                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setCalendarDate(new Date(calendarDate.getFullYear(), calendarDate.getMonth() - 1, 1))}
                      className="p-2 border rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-xs font-semibold"
                    >
                      &lt; Prev
                    </button>
                    <button
                      onClick={() => setCalendarDate(new Date(TODAY_DATE.getFullYear(), TODAY_DATE.getMonth(), 1))}
                      className="px-3 py-2 border rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-xs font-semibold"
                    >
                      Today
                    </button>
                    <button
                      onClick={() => setCalendarDate(new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 1))}
                      className="p-2 border rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-xs font-semibold"
                    >
                      Next &gt;
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-7 gap-2 text-center text-xs font-bold text-slate-400 mb-2">
                  <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
                </div>

                <div className="grid grid-cols-7 gap-2">
                  {calendarData.days.map((cell, idx) => {
                    if (!cell) return <div key={idx} className="h-20 bg-slate-50/50 dark:bg-slate-900/30 rounded-xl"></div>;
                    const dayTasks = tasks.filter(t => t.dueDate === cell.fullDate);
                    const isToday = cell.fullDate === TODAY_STR;

                    return (
                      <div key={idx} className={`h-24 p-2 rounded-xl border text-xs flex flex-col justify-between ${isToday ? 'border-indigo-500 bg-indigo-50/30 dark:bg-indigo-950/20 font-bold' : 'border-slate-100 dark:border-slate-700'}`}>
                        <span className="text-slate-500">{cell.dayNumber}</span>
                        {dayTasks.length > 0 && (
                          <div className="bg-indigo-600 text-white text-[10px] p-1 rounded font-semibold truncate">
                            {dayTasks.length} Task(s)
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* PAGE 4: PROFILE SETTINGS */}
            {currentView === 'profile' && (
              <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm max-w-md space-y-6">
                <h3 className="font-bold text-lg">User Profile</h3>
                <form onSubmit={handleProfileUpdate} className="space-y-4">
                  <div className="flex items-center gap-4">
                    {user.avatar ? (
                      <img src={user.avatar} className="w-16 h-16 rounded-full object-cover" alt="Avatar" />
                    ) : (
                      <div className="w-16 h-16 rounded-full bg-indigo-600 text-white font-black text-xl flex items-center justify-center">JD</div>
                    )}
                    <div>
                      <label className="text-xs bg-slate-100 dark:bg-slate-700 px-3 py-1.5 rounded-lg font-semibold cursor-pointer hover:bg-slate-200">
                        Upload Avatar
                        <input
                          type="file"
                          accept="image/*"
                          onChange={(e) => {
                            const file = e.target.files[0];
                            if (file) {
                              const reader = new FileReader();
                              reader.onloadend = () => setUser({ ...user, avatar: reader.result });
                              reader.readAsDataURL(file);
                            }
                          }}
                          className="hidden"
                        />
                      </label>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 font-semibold mb-1">Full Name</label>
                    <input
                      type="text"
                      value={user.name}
                      onChange={(e) => setUser({ ...user, name: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded-xl text-sm"
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 font-semibold mb-1">Email Address</label>
                    <input
                      type="email"
                      value={user.email}
                      onChange={(e) => setUser({ ...user, email: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded-xl text-sm"
                    />
                  </div>

                  <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl text-xs font-bold">
                    Save Changes
                  </button>
                </form>
              </div>
            )}

            {/* PAGE 5: APP CONFIGURATION */}
            {currentView === 'settings' && (
              <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm max-w-md space-y-6">
                <h3 className="font-bold text-lg">App Settings</h3>
                
                <div className="space-y-4 text-sm">
                  <div className="flex items-center justify-between">
                    <div>
                      <span className="font-semibold block">Push Notifications</span>
                      <span className="text-xs text-slate-400">Receive alerts on task deadlines</span>
                    </div>
                    <input
                      type="checkbox"
                      checked={settings.notifications}
                      onChange={(e) => setSettings({ ...settings, notifications: e.target.checked })}
                      className="w-4 h-4 text-indigo-600 rounded"
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-slate-400 font-semibold mb-1">Timezone</label>
                    <select
                      value={settings.timezone}
                      onChange={(e) => setSettings({ ...settings, timezone: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded-xl text-xs"
                    >
                      <option value="UTC+5:30 (IST)">UTC+5:30 (IST)</option>
                      <option value="UTC-5 (EST)">UTC-5 (EST)</option>
                      <option value="UTC+0 (GMT)">UTC+0 (GMT)</option>
                    </select>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* TASK FORM MODAL */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-lg">{editingTask ? 'Edit Task' : 'Create Task'}</h3>
                  <button onClick={closeModal} className="text-slate-400 hover:text-slate-600" aria-label="Close modal">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <form onSubmit={handleSaveTask} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-500 mb-1">Task Title</label>
                    <input
                      type="text"
                      required
                      placeholder="Enter title..."
                      value={formData.title}
                      onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-500 mb-1">Description</label>
                    <textarea
                      placeholder="Task details..."
                      value={formData.description}
                      onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                      className="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm h-20 resize-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Category</label>
                      <select
                        value={formData.category}
                        onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                      >
                        <option value="Personal">Personal</option>
                        <option value="College">College</option>
                        <option value="Freelancing">Freelancing</option>
                        <option value="Fitness">Fitness</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Priority</label>
                      <select
                        value={formData.priority}
                        onChange={(e) => setFormData({ ...formData, priority: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                      >
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Status Stage</label>
                      <select
                        value={formData.status}
                        onChange={(e) => setFormData({ ...formData, status: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                      >
                        <option value="todo">To Do</option>
                        <option value="in_progress">In Progress</option>
                        <option value="review">Review</option>
                        <option value="completed">Completed</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-500 mb-1">Due Date</label>
                      <input
                        type="date"
                        value={formData.dueDate}
                        onChange={(e) => setFormData({ ...formData, dueDate: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm"
                      />
                    </div>
                  </div>

                  <div className="pt-2 flex gap-2 justify-end">
                    <button type="button" onClick={closeModal} className="px-4 py-2 rounded-xl text-sm font-semibold border">Cancel</button>
                    <button type="submit" className="px-4 py-2 rounded-xl text-sm font-semibold bg-indigo-600 text-white">Save Task</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* DELETE CONFIRMATION MODAL */}
          {deletingTaskId && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-800 w-full max-w-sm rounded-2xl p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4 text-center">
                <div className="w-12 h-12 bg-rose-100 dark:bg-rose-950/50 text-rose-600 rounded-full flex items-center justify-center mx-auto">
                  <i data-lucide="alert-triangle" className="w-6 h-6"></i>
                </div>
                <h3 className="font-bold text-lg">Delete Task?</h3>
                <p className="text-xs text-slate-400">Are you sure you want to delete this task? This action cannot be undone.</p>
                <div className="flex gap-2 justify-center">
                  <button onClick={() => setDeletingTaskId(null)} className="px-4 py-2 rounded-xl text-xs font-bold border">Cancel</button>
                  <button onClick={confirmDeleteTask} className="px-4 py-2 rounded-xl text-xs font-bold bg-rose-600 text-white">Delete Task</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TaskFlowPro />);
  </script>
</body>
</html>
